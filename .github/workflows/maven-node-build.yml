name: Build all

on:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin # timezone
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-checkout@4485daa4781dde13e7d9d5f4d8acbe33f993299c # v1.7.0
      - if: ${{ hashFiles('./package.json')!=null }}
        id: node
        uses: it-at-m/lhm_actions/action-templates/actions/action-npm-build@4485daa4781dde13e7d9d5f4d8acbe33f993299c # v1.7.0
        with:
          app-path: ""
      - if: ${{ hashFiles('./pom.xml')!=null }}
        id: maven
        uses: it-at-m/lhm_actions/action-templates/actions/action-maven-build@4485daa4781dde13e7d9d5f4d8acbe33f993299c # v1.7.0
        with:
          app-path: ""
